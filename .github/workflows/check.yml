name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun install --cwd worker --frozen-lockfile
      - run: bun run build
      - run: bun run --cwd worker build
      - run: bun run format:check

  dev-tasks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun install --cwd worker --frozen-lockfile
      - name: Core and contract tests
        run: bun test ./src ./contracts
      - name: Worker and script tests
        run: bun test ./worker/src ./scripts

  ccxp:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/Dockerfile.ccxp -t minisago-ccxp:test .
      - run: docker run --rm --init --shm-size=256m -e CCXP_TEST_EXTENSION=/opt/ccxplite minisago-ccxp:test bun test
