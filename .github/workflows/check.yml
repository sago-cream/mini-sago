name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun install --cwd worker --frozen-lockfile
      - run: bun run build
      - run: bun run --cwd worker build
      - run: bun test worker/src/codex-path.test.ts worker/src/config.test.ts
      - run: bun test src/chatbot/ccxp/ccxp-sync.test.ts src/chatbot/ccxp/ccxp-meetings.test.ts src/discord/feature-availability.test.ts src/discord/feature-access.test.ts src/discord/bot-management.test.ts src/discord/bot-status.test.ts src/discord/gateway.test.ts src/chatbot/drive/google-drive.test.ts src/chatbot/calendar/google-calendar.test.ts src/discord/jobs/ccxp-auth-notifications.test.ts src/chatbot/mcp.test.ts src/chatbot/mail/mail.test.ts

  dev-tasks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun install --cwd worker --frozen-lockfile
      - run: bun test scripts/deploy-socket.test.ts src/chatbot/chatbot.test.ts src/chatbot/developer-tasks.test.ts src/chatbot/developer-thread-store.test.ts src/chatbot/developer-thread-recovery.test.ts src/chatbot/member-mentions.test.ts src/chatbot/guild-memory.test.ts src/chatbot/guild-memory-sync.test.ts src/chatbot/guild-memory-conversation.test.ts src/chatbot/bridge.test.ts src/chatbot/media-assets.test.ts worker/src/developer-workspace.test.ts worker/src/developer-runtime.test.ts worker/src/deployment-mcp.test.ts worker/src/codex-app-server.test.ts worker/src/codex.test.ts worker/src/codex-developer.test.ts worker/src/codex-warm.test.ts worker/src/trace-store.test.ts worker/src/media/attachments.test.ts worker/src/media/media.test.ts worker/src/media/media-mcp.test.ts worker/src/media/outgoing-files.test.ts
      - run: sudo apparmor_parser -r scripts/test-fixtures/worker-security/minisago-worker.apparmor
      - run: bash scripts/test-dev-sandbox.sh

  ccxp:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/Dockerfile.ccxp -t minisago-ccxp:test .
      - run: docker run --rm --init --shm-size=256m -e CCXP_TEST_EXTENSION=/opt/ccxplite minisago-ccxp:test bun test
