<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Voice debug</title>
    <link rel="stylesheet" href="/voice-debug/style.css" />
    <script defer src="/voice-debug/timeline.js"></script>
    <script defer src="/voice-debug/app.js"></script>
  </head>
  <body>
    <main>
      <form id="login" hidden>
        <label for="token">Access token</label
        ><input
          id="token"
          type="password"
          required
          autocomplete="off"
        /><button>Sign in</button>
      </form>
      <section id="test" hidden>
        <aside class="record-sidebar" aria-label="Recordings">
          <div class="record-search">
            <input
              id="record-search"
              type="search"
              placeholder="Search recordings"
              aria-label="Search recordings"
            />
            <button id="record">Record new</button>
          </div>
          <div id="record-list" role="list" aria-label="Saved recordings"></div>
        </aside>
        <section class="run-panel" aria-label="Voice test">
          <div class="run-controls">
            <audio
              id="capture-audio"
              controls
              preload="metadata"
              hidden
            ></audio>
            <button id="rerun" class="primary" disabled>Run</button>
            <button id="stop" hidden>Stop reply</button>
          </div>
          <p id="status" role="status"></p>
          <p id="first-audio"></p>
          <table class="flow-table">
            <thead>
              <tr>
                <th>Module</th>
                <th id="time-axis">Timeline</th>
                <th>Output</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th>
                  <button
                    class="module-toggle"
                    aria-expanded="false"
                    aria-controls="whisper-details"
                  >
                    Whisper
                  </button>
                </th>
                <td id="whisper-time">—</td>
                <td>
                  <p id="whisper-output">—</p>
                </td>
              </tr>
              <tr id="whisper-details" hidden>
                <td></td>
                <td class="module-details"><div id="whisper-stages"></div></td>
                <td></td>
              </tr>
              <tr>
                <th>
                  <button
                    class="module-toggle"
                    aria-expanded="false"
                    aria-controls="codex-details"
                  >
                    Codex
                  </button>
                </th>
                <td id="codex-time">—</td>
                <td><p id="codex-output">—</p></td>
              </tr>
              <tr id="codex-details" hidden>
                <td></td>
                <td class="module-details"><div id="codex-stages"></div></td>
                <td></td>
              </tr>
              <tr>
                <th>
                  <button
                    class="module-toggle"
                    aria-expanded="false"
                    aria-controls="tts-details"
                  >
                    VOICEVOX
                  </button>
                </th>
                <td id="tts-time">—</td>
                <td><p id="tts-output">—</p></td>
              </tr>
              <tr id="tts-details" hidden>
                <td></td>
                <td class="module-details"><div id="tts-stages"></div></td>
                <td></td>
              </tr>
              <tr>
                <th>
                  <button
                    class="module-toggle"
                    aria-expanded="false"
                    aria-controls="audio-details"
                  >
                    Playback
                  </button>
                </th>
                <td id="audio-time">—</td>
                <td><p id="audio-output">—</p></td>
              </tr>
              <tr id="audio-details" hidden>
                <td></td>
                <td class="module-details"><div id="audio-stages"></div></td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </section>
      </section>
      <p id="error" role="alert" hidden></p>
    </main>
  </body>
</html>
